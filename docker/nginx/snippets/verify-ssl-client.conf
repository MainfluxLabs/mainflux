# Only a verified client certificate or no certificate is accepted.
# The empty value denotes plain HTTP.
# A client without a certificate authenticates with the Authorization header instead.
if ($ssl_client_verify !~ ^(SUCCESS|NONE)?$) {
    return 403;
}
if ($auth_key = '') {
    return 403;
}