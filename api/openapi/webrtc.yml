openapi: 3.0.1
info:
  title: Mainflux webrtc service
  description: HTTP API for viewing live media published by things through the WebRTC SFU.
  version: 1.0.0

paths:
  /webrtc/ice-servers:
    get:
      summary: Retrieves ICE servers
      description: Retrieves the STUN and TURN servers, with short-lived TURN credentials when TURN is configured.
      tags:
        - webrtc
      security:
        - bearerAuth: []
      responses:
        '200':
          description: ICE servers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ICEServersRes"
        '401':
          description: Missing or invalid access token provided.
        '500':
          $ref: "#/components/responses/ServiceError"
  /webrtc/things/{thingId}/view:
    post:
      summary: Views the live stream of a thing
      description: |
        Sends an SDP offer and returns the SDP answer once ICE gathering is complete.
        The user must have viewer access to the thing, and the thing must have an active publisher.
      tags:
        - webrtc
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ThingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewReq"
      responses:
        '201':
          description: Viewer session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewRes"
        '400':
          description: Failed due to malformed JSON, empty or malformed SDP.
        '401':
          description: Missing or invalid access token provided.
        '403':
          description: Failed to perform authorization over the entity.
        '404':
          description: Thing has no active publisher.
        '415':
          description: Missing or invalid content type.
        '500':
          $ref: "#/components/responses/ServiceError"
  /webrtc/sessions/{sessionId}/candidates:
    patch:
      summary: Adds a viewer ICE candidate
      description: Adds a remote ICE candidate to the viewer session of the authenticated user.
      tags:
        - webrtc
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateReq"
      responses:
        '204':
          description: Candidate added.
        '400':
          description: Failed due to malformed JSON or empty candidate.
        '401':
          description: Missing or invalid access token provided.
        '404':
          description: Unknown session, or session owned by another user.
        '415':
          description: Missing or invalid content type.
        '500':
          $ref: "#/components/responses/ServiceError"
  /health:
    get:
      summary: Retrieves service health check info.
      tags:
        - health
      responses:
        '200':
          description: Service is healthy.

components:
  schemas:
    ICEServer:
      type: object
      properties:
        urls:
          type: array
          items:
            type: string
        username:
          type: string
        credential:
          type: string
      required:
        - urls
    ICEServersRes:
      type: object
      properties:
        ice_servers:
          type: array
          items:
            $ref: "#/components/schemas/ICEServer"
      required:
        - ice_servers
    ICECandidate:
      type: object
      properties:
        candidate:
          type: string
        sdpMid:
          type: string
        sdpMLineIndex:
          type: integer
        usernameFragment:
          type: string
      required:
        - candidate
    ViewReq:
      type: object
      properties:
        sdp:
          type: string
          description: SDP offer.
      required:
        - sdp
    ViewRes:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
        sdp:
          type: string
          description: SDP answer.
      required:
        - session_id
        - sdp
    CandidateReq:
      type: object
      properties:
        candidate:
          $ref: "#/components/schemas/ICECandidate"
      required:
        - candidate
  parameters:
    ThingId:
      name: thingId
      description: Unique thing identifier.
      in: path
      schema:
        type: string
        format: uuid
      required: true
    SessionId:
      name: sessionId
      description: Unique viewer session identifier.
      in: path
      schema:
        type: string
        format: uuid
      required: true
  responses:
    ServiceError:
      description: Unexpected server-side error occurred.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
